name: known_hosts flush probe on Windows

on:
  push:
    branches: [windows-flush-probe]
  workflow_dispatch:

jobs:
  probe:
    name: flush probe (py${{ matrix.python }})
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e . "paramiko>=3.4"
      - name: Probe
        run: python -u .github/windows_flush_probe.py 4 50 10
