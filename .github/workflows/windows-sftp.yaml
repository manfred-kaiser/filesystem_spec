name: SFTP on Windows

on:
  push:
    branches: [windows-sftp-ci]
  workflow_dispatch:

jobs:
  win:
    name: test_sftp (py${{ matrix.python }}, paramiko ${{ matrix.paramiko }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            paramiko: "==3.4.0"
          - python: "3.13"
            paramiko: ">=3.4"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e . pytest "paramiko${{ matrix.paramiko }}"
      - name: Environment
        run: python -c "import os, sys, paramiko; print(sys.version); print('paramiko', paramiko.__version__); print(os.path.expanduser('~/.ssh/known_hosts'))"
      - name: Test
        run: python -m pytest fsspec/implementations/tests/test_sftp.py -v -rs
